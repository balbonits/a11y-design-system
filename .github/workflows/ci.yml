name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Serve Storybook
        run: npx http-server storybook-static -p 6007 -s &
      - run: npx wait-on -t 60000 http://127.0.0.1:6007/index.json
      - run: npm run test:a11y
        env:
          CHROME_PATH: /usr/bin/google-chrome
