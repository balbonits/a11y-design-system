name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:colors
      - run: npm run contrast
      - run: npm test
      - run: npm run build
      - run: npm run check:core-bundle
      - name: Serve Storybook
        run: npx http-server storybook-static -p 6007 -s &
      - run: npx wait-on -t 60000 http://127.0.0.1:6007/index.json
      - run: npm run test:a11y
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm run test:mobile
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm run test:focus-obscured
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Target size gate calibration (synthetic boxes of known size)
        run: npm run test:target-size -- --calibrate
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Target size gate (WCAG 2.5.8, effective hit area, every story at 320 and 1280px)
        run: npm run test:target-size -- http://127.0.0.1:6007
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Target size gate negative control (a shrunk button must fail)
        run: npm run test:target-size -- http://127.0.0.1:6007 --negative-control
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Toast inside a modal (FU-EMBER-TOAST-MODAL, 320/375/1280, every theme, light/dark, reduced motion)
        run: npm run test:toast-modal -- http://127.0.0.1:6007
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Press-offset gate (Addendum 8, every Button variant moves by --press-offset; 0 under reduced motion)
        run: npm run test:press -- http://127.0.0.1:6007
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Press-offset gate negative control (a button that doesn't move must fail)
        run: npm run test:press -- http://127.0.0.1:6007 --negative-control
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Hover gate (Addendum 10; neo unchanged from baseline, kinetic inversion, disabled/aria-disabled, forced colors)
        run: npm run test:hover -- http://127.0.0.1:6007
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: VideoPlayer gates (R4-TESTS-FIRST; fixme until the player lands, switch VP_GATES in scripts/vp-gates.mjs)
        run: npm run test:vp -- http://127.0.0.1:6007
        env:
          CHROME_PATH: /usr/bin/google-chrome
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/transcribe/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-faster-whisper-small.en-v1
      - name: Unit tests and committed-file checks (no model)
        working-directory: tools/transcribe
        run: python3 -m unittest discover -s tests -v
      - name: Validate committed WebVTT (W3C webvtt.js strict, then monotonic times and no overlaps per track)
        run: |
          npm install --no-save --prefix tools/transcribe/.w3c webvtt-parser@2.2.0
          node tools/transcribe/validate-vtt-w3c.mjs tools/transcribe/samples/sintel/*.vtt stories/media/sintel/*.vtt
          python3 tools/transcribe/validate_vtt.py tools/transcribe/samples/sintel/*.vtt stories/media/sintel/*.vtt
      - name: Clean-checkout run (transcribe, validate, spot-check)
        run: tools/transcribe/run.sh
      - name: Regenerated output matches the committed files
        run: |
          if ! git diff --quiet -- tools/transcribe/samples; then
            git diff --stat -- tools/transcribe/samples
            git diff -- tools/transcribe/samples
            echo "::error::Regenerated captions differ from the committed ones; the committed outputs must be reproducible."
            exit 1
          fi
