<style>
  /* Docs-page contrast fixes for Storybook's own chrome (links and code highlighting) so axe passes AA. */
  .sbdocs a:not(.em-btn) { color: #0b57a4; text-decoration: underline; }
  .docblock-source .token, .docblock-source code span { color: #1f2328 !important; }
  .docblock-source .token.comment { color: #57606a !important; }
  .docblock-source .token.tag, .docblock-source .token.class-name, .docblock-source .token.keyword { color: #8a1c3d !important; }
  .docblock-source .token.attr-name { color: #6f3d00 !important; }
  .docblock-source .token.string, .docblock-source .token.attr-value { color: #0a5a2a !important; }
  .docblock-source .token.punctuation, .docblock-source .token.operator { color: #3d4450 !important; }
  /* Mobile-first docs: nothing may push the page sideways. Wide tables and code scroll inside their own box. */
  .sbdocs-wrapper { overflow-x: hidden; }
  .sbdocs-content { max-width: 100%; min-width: 0; }
  .sb-scroll { overflow-x: auto; max-width: 100%; }
  .sb-scroll:focus-visible { outline: var(--focus-ring-width, 3px) var(--focus-ring-style, solid) var(--focus-ring-color, #0b57a4); outline-offset: var(--focus-ring-offset, 2px); }
  .sbdocs-content > table { display: block; overflow-x: auto; max-width: 100%; }
  /* The props table keeps its table semantics and wraps long values instead of scrolling. */
  .sbdocs .docblock-argstable { width: 100%; table-layout: fixed; }
  .sbdocs .docblock-argstable td, .sbdocs .docblock-argstable th { overflow-wrap: anywhere; word-break: break-word; }
  .sbdocs pre, .docblock-source { overflow-x: auto; max-width: 100%; }
  /* Storybook's own docs buttons (Copy, Show code, zoom) get 44px targets too. */
  .sbdocs button:not(.em-btn):not(.em-sort):not([role="tab"]) { min-height: 44px; min-width: 44px; }
  @media (max-width: 640px) { .sbdocs-wrapper { padding-left: 12px !important; padding-right: 12px !important; } }
</style>
